version: '3.8'

services:
  fortibank-backend:
    image: fortibank-backend:latest
    container_name: prod-fortibank_atm
    restart: unless-stopped
    working_dir: /app
    dns:
      - 192.168.241.3
    environment:
      - WORKERS=2
      - PORT=8000
      - TZ=America/Mexico_City
      - ROOT_PASSWORD=Fortinet1
    networks:
      lan_bridge:
        ipv4_address: 192.168.241.11
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/docs')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  lan_bridge:
    external: true
