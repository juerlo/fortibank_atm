# Route default audio to HDMI (card 2) and force the HDMI-standard 48 kHz.
# The app's WAV/MP3 assets are 44.1 kHz; many HDMI monitor audio paths only
# lock to 48 kHz, so we resample 44.1 -> 48 kHz here.
pcm.!default {
    type plug
    slave {
        pcm "hw:2,0"
        rate 48000
    }
}

ctl.!default {
    type hw
    card 2
}
