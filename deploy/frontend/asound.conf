# Route default ALSA playback through dmix on HDMI (card 2), locked to 48000 Hz
# S16_LE stereo. dmix lets multiple processes share the single hw:2,0 stream and
# plug resamples the app 44.1 kHz assets to 48 kHz.
pcm.hdmi_dmix {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:2,0"
        rate 48000
        channels 2
        format S16_LE
    }
}

pcm.!default {
    type plug
    slave.pcm "hdmi_dmix"
}

ctl.!default {
    type hw
    card 2
}
