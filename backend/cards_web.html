<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FortiBank · Administración de Tarjetas</title>
<style>
  :root{--blue:#0b4a8f;--bg:#0e1b2b;--card:#13263d;--line:#24405f;--txt:#e8eef6;--muted:#9fb3c8;--ok:#2ecc71;--err:#e74c3c;--accent:#f39c12}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  header{background:var(--blue);padding:16px 22px}
  header h1{margin:0;font-size:20px}
  header .dot{color:var(--accent)}
  main{max-width:1000px;margin:24px auto;padding:0 16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
  h2{margin:0 0 14px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
  tr:last-child td{border-bottom:0}
  .num{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}
  .visa{color:#8ea2ff}.mc{color:var(--accent)}
  button{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px}
  .btn{background:#2a4a6b;color:#fff}.btn:hover{background:#35608a}
  .btn.primary{background:var(--ok);color:#06240f}
  .btn.danger{background:var(--err);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .row-actions{display:flex;gap:6px}
  form{display:grid;grid-template-columns:1.4fr .7fr 1.4fr .9fr .9fr auto;gap:10px;align-items:end}
  label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  input,select{background:#0b1a2b;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
  input[readonly]{opacity:.7}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
  .actions{display:flex;gap:8px}
  @media(max-width:820px){form{grid-template-columns:1fr 1fr}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<header><h1><span class="dot">&#9679;</span> FortiBank <span style="font-weight:400;opacity:.8">&middot; Administración de Tarjetas</span></h1></header>
<main>
  <section class="panel">
    <h2 id="formTitle">Agregar tarjeta</h2>
    <form id="cardForm" autocomplete="off">
      <input type="hidden" id="editing" value="">
      <label>Número de tarjeta<input id="card_number" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" required placeholder="4591061418966700"></label>
      <label>NIP<input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="1234"></label>
      <label>Nombre<input id="name" required placeholder="Nombre Apellido"></label>
      <label>Marca<select id="brand"><option>VISA</option><option>MASTERCARD</option></select></label>
      <label>Saldo<input id="balance" type="number" step="0.01" min="0" value="0.00"></label>
      <div class="actions">
        <button type="submit" class="btn primary" id="saveBtn">Agregar</button>
        <button type="button" class="btn ghost" id="cancelEdit" style="display:none">Cancelar</button>
      </div>
    </form>
    <div class="msg" id="msg"></div>
  </section>

  <section class="panel">
    <h2>Tarjetas (<span id="count">0</span>)</h2>
    <table>
      <thead><tr><th>Número</th><th>Nombre</th><th>Marca</th><th>Saldo</th><th>NIP</th><th>Acciones</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="msg" id="msg2"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const api = '/api/cards';
let cards = [];

const money = n => '$' + Number(n).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const setMsg = (el, text, ok) => { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); };

async function load() {
  try {
    const r = await fetch(api);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    cards = await r.json();
    if (!Array.isArray(cards)) cards = [];
    render();
    setMsg($('#msg2'), '', true);
  } catch (e) {
    setMsg($('#msg2'), 'No se pudo cargar: ' + e.message, false);
  }
}

function render() {
  const rows = $('#rows');
  rows.innerHTML = '';
  $('#count').textContent = cards.length;
  cards.forEach(c => {
    const tr = document.createElement('tr');
    const brand = (c.brand || '').toUpperCase();
    const cls = brand === 'VISA' ? 'visa' : 'mc';
    tr.innerHTML =
      '<td class="num">' + c.card_number + '</td>' +
      '<td>' + (c.name || '') + '</td>' +
      '<td class="' + cls + '">' + (c.brand || '') + '</td>' +
      '<td>' + money(c.balance) + '</td>' +
      '<td class="num">' + (c.pin || '') + '</td>' +
      '<td><div class="row-actions">' +
        '<button class="btn" data-edit="' + c.card_number + '">Editar</button>' +
        '<button class="btn danger" data-del="' + c.card_number + '">Eliminar</button>' +
      '</div></td>';
    rows.appendChild(tr);
  });
}

function resetForm() {
  $('#editing').value = '';
  $('#cardForm').reset();
  $('#card_number').readOnly = false;
  $('#balance').value = '0.00';
  $('#brand').value = 'VISA';
  $('#formTitle').textContent = 'Agregar tarjeta';
  $('#saveBtn').textContent = 'Agregar';
  $('#cancelEdit').style.display = 'none';
}

$('#cancelEdit').addEventListener('click', resetForm);

$('#cardForm').addEventListener('submit', async e => {
  e.preventDefault();
  const editing = $('#editing').value;
  const body = {
    card_number: $('#card_number').value.trim(),
    pin: $('#pin').value.trim(),
    name: $('#name').value.trim(),
    brand: $('#brand').value,
    balance: parseFloat($('#balance').value || '0')
  };
  const method = editing ? 'PUT' : 'POST';
  const url = editing ? api + '/' + encodeURIComponent(editing) : api;
  const payload = editing ? { pin: body.pin, name: body.name, brand: body.brand, balance: body.balance } : body;
  try {
    const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setMsg($('#msg'), editing ? 'Tarjeta actualizada' : 'Tarjeta agregada', true);
    resetForm();
    await load();
  } catch (err) {
    setMsg($('#msg'), 'Error: ' + err.message, false);
  }
});

$('#rows').addEventListener('click', async e => {
  const edit = e.target.getAttribute('data-edit');
  const del = e.target.getAttribute('data-del');
  if (edit) {
    const c = cards.find(x => x.card_number === edit);
    if (!c) return;
    $('#editing').value = c.card_number;
    $('#card_number').value = c.card_number;
    $('#card_number').readOnly = true;
    $('#pin').value = c.pin || '';
    $('#name').value = c.name || '';
    $('#brand').value = (c.brand || 'VISA').toUpperCase();
    $('#balance').value = c.balance != null ? c.balance : 0;
    $('#formTitle').textContent = 'Editar tarjeta ' + c.card_number;
    $('#saveBtn').textContent = 'Actualizar';
    $('#cancelEdit').style.display = 'inline-block';
    $('#card_number').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (del) {
    if (!confirm('¿Eliminar la tarjeta ' + del + '?')) return;
    try {
      const r = await fetch(api + '/' + encodeURIComponent(del), { method: 'DELETE' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if ($('#editing').value === del) resetForm();
      await load();
    } catch (err) {
      setMsg($('#msg2'), 'Error: ' + err.message, false);
    }
  }
});

load();
setInterval(load, 10000);
</script>
</body>
</html>
